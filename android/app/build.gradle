plugins { id 'com.android.application' }

def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'it.ciempionsfig.app'
    compileSdk 35
    defaultConfig {
        applicationId 'it.ciempionsfig.app'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }
    signingConfigs {
        release {
            storeFile rootProject.file('release.jks')
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
