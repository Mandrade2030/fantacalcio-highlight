name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME
          echo "$HOME/gradle-8.11.1/bin" >> $GITHUB_PATH
      - name: Compila APK firmato
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Rinomina
        run: cp android/app/build/outputs/apk/release/app-release.apk ciempions-fig.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Ciempions Fig app 1.0.${{ github.run_number }}
          body: "App Android di Fanta Highlights. Scarica ciempions-fig.apk e installala sul telefono."
          files: ciempions-fig.apk
          make_latest: true
